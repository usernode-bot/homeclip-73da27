<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number') return String(v);
        if (typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return (val.stack || (v.name + ': ' + v.message));
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>HomeClip</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237c3aed'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app. The config lives in
       tailwind.config.js in the repo root; npm run build compiles it to
       public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime is invisible to the compiler. -->
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="stylesheet" href="/screens.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path. It
       is NOT conditional on this app calling a bridge API: it is also how the
       app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question — offline launch included.
       The bridge also reports the viewer's Homeroom theme to the script
       below, and turns an account_required answer into the platform's
       make-an-account sheet. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. The app's own Settings
       screen layers an override on top: a profile set to Light or Dark wins;
       "Follow Homeroom" (the default) removes the override. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function override() {
        try { return localStorage.getItem('hc:ui:theme'); } catch (e) { return null; }
      }
      function applyTheme() {
        var chosen = override();
        var theme = (chosen === 'light' || chosen === 'dark') ? chosen
          : ((window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light'));
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      window.__hcApplyTheme = applyTheme;
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="min-h-screen bg-ground text-fg">
  <header class="mx-auto w-full max-w-2xl px-4 pt-5">
    <div class="flex items-center gap-2">
      <a href="/" data-nav class="flex items-center gap-2" aria-label="HomeClip home">
        <span class="flex h-10 w-10 items-center justify-center rounded-xl border border-line bg-surface text-[1.25rem]" aria-hidden="true">📺</span>
        <span class="text-heading">HomeClip</span>
      </a>
      <span class="flex-1"></span>
      <a href="/search" data-nav class="btn-secondary min-w-11" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      </a>
      <a href="/profiles" data-nav id="profile-chip" class="profile-chip" aria-label="Who's watching?">
        <span class="avatar avatar-sm" data-chip-avatar>D</span>
        <span class="text-small" data-chip-name>…</span>
      </a>
    </div>
  </header>
  <main id="view" class="page-column px-4 pb-16 pt-5" aria-live="polite"></main>

  <!-- App scripts: store (cache + offline queue), api (identity + profile
       context), screens (every screen plus shared UI helpers), player,
       router, boot. Classic scripts on window.HC — no bundler. -->
  <script src="/js/store.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/screens.js"></script>
  <script src="/js/player.js"></script>
  <script src="/js/router.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
