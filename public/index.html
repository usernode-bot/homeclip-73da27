<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (v.name + ': ' + v.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>HomeClip</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237c3aed'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app. The config lives in
       tailwind.config.js; npm run build compiles it to public/tailwind.css on
       every image build, so the stylesheet is regenerated from THIS commit's
       markup and can never drift behind the code. Class names are written as
       whole literals (in index.html and app.js) so the compiler sees them.
       -->
  <link rel="stylesheet" href="/tailwind.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path. Never
       vendor it and never write a hostname in front of it. It is NOT
       conditional on this app calling a bridge API: it is also how the app
       ANSWERS the shell, and it is where the app learns the viewer's
       light/dark theme: the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="min-h-screen bg-ground text-fg">
  <main class="page-column flex flex-col gap-6 px-4 py-6">
    <!-- The app's own mark: the emoji from dapp.json's icon block. -->
    <header class="flex items-center justify-between gap-2">
      <a href="/" data-link class="flex items-center gap-2 no-underline text-fg">
        <span class="flex h-10 w-10 items-center justify-center rounded-xl border border-line bg-surface text-xl" aria-hidden="true">📺</span>
        <span class="text-heading">HomeClip</span>
      </a>
      <nav class="flex items-center gap-2">
        <a id="vip-button" href="/vip" data-link class="btn-secondary">VIP</a>
      </nav>
    </header>

    <div id="view" class="flex flex-col gap-6">
      <!-- Filled by app.js. The skeleton below is what shows while the first
           load fetches the feed. -->
      <ul class="list" aria-hidden="true">
        <li class="list-row"><div class="h-12 w-12 flex-none rounded-md skeleton"></div><div class="flex min-w-0 grow flex-col gap-2"><div class="h-4 w-1/2 rounded skeleton"></div><div class="h-3 w-1/3 rounded skeleton"></div></div></li>
        <li class="list-row"><div class="h-12 w-12 flex-none rounded-md skeleton"></div><div class="flex min-w-0 grow flex-col gap-2"><div class="h-4 w-1/2 rounded skeleton"></div><div class="h-3 w-1/3 rounded skeleton"></div></div></li>
        <li class="list-row"><div class="h-12 w-12 flex-none rounded-md skeleton"></div><div class="flex min-w-0 grow flex-col gap-2"><div class="h-4 w-1/2 rounded skeleton"></div><div class="h-3 w-1/3 rounded skeleton"></div></div></li>
      </ul>
    </div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
